# 「页面」那一份（nginx）：发静态资源 + 把接口接回来
#
# 它与 Cloudflare 那份的 `pages/_worker.js` 是**同一个角色**：页面和接口分开部署之后，
# 前端里那些**相对地址**（`/api/...`）、HttpOnly + SameSite=Lax 的会话 cookie、以及
# 服务端下发的 `/api/media/<签名>`，都要求浏览器从头到尾只看到一个源。所以这里同源反代，
# 而不是让页面跨源去调接口（那样要动 CORS、把 cookie 降级成第三方 cookie、并把每条
# 媒体地址改成绝对地址 —— 见 EXPERIENCE.md 第八十二轮）。
#
# 下面那三个数字是**踩出来的**，不是照抄模板：
#
#   1. `proxy_read_timeout 600s` —— 接口那一侧默认一次搜索跑完全部启用的书源，
#      实测 924 个源要 **184.5 秒**，而 nginx 默认 60 秒就断：表现是「搜索转一会儿弹 504」，
#      接口本身却是好的，特别容易误判成前端坏了。
#   2. `client_max_body_size 64m` —— 导入书源那一份语料是 800 多条、**约 4.5 MB**，
#      而 nginx 默认上限 **1 MB**：不改的话导入直接被 413，接口那边根本收不到。
#   3. `proxy_set_header Host $http_host` —— 接口那一侧是**用 Host 推出请求源**的
#      （`src/server/node.ts` 里的 `origin`）：夹具书源拼出来的地址、以及会话 cookie 的
#      `Secure` 判断都跟着它。少了这一行，nginx 传的是上游名，这两处会一起错。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 见文件头第 2 条
    client_max_body_size 64m;

    # 接口与内置测试站点 → api 那一份（`api` 就是 compose 里的服务名，走 compose 内网）
    #
    # **用变量写上游是有原因的**：`proxy_pass http://api:8787` 这种写法，nginx 在**启动时**
    # 解析一次上游名、然后一直用那个 IP —— 之后 api 容器重建换了地址，它就一直在打旧地址
    # （全站接口 502），除非有人记得把 page 也重启一遍。写成变量之后按 `valid=10s` 重新解析。
    # （顺带一条：名字解析不出来的话 nginx **直接起不来**（`host not found in upstream`）——
    # 这是好事，比默默 502 强；compose 里那个 `depends_on: service_healthy` 保证它起的时候
    # api 已经在了。）
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|fixture)/ {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长搜索（第 1 条）与流式媒体：别缓冲、别按默认的 60 秒断
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 其余都是静态资源。找不到就回 `index.html` —— 与 wrangler.jsonc 的
    # `not_found_handling: single-page-application`、以及自建那份的 404 回退同一条策略。
    # 路由是 hash 的，所以这条回退平时用不到；留着是为了三种部署的行为**一致**。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
