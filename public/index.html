<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>书源阅读器</title>
        <link rel="stylesheet" href="/style.css" />
        <!--
            刻意不做「先渲染骨架再水合」那一套：这是个单页小应用，
            首屏多等几十毫秒换来说到底更简单的代码，划算。
        -->
    </head>
    <body>
        <header class="topbar">
            <span class="brand">书源阅读器</span>
            <nav>
                <button class="tab" data-route="shelf" type="button">书架</button>
                <button class="tab" data-route="search" type="button">搜索</button>
                <button class="tab" data-route="sources" type="button">书源</button>
            </nav>
            <a
                class="icon-btn"
                href="/api/probe"
                target="_blank"
                rel="noreferrer"
                title="运行时自检"
                >自检</a
            >
        </header>

        <div
            id="toast"
            hidden
            style="
                position: fixed;
                z-index: 40;
                left: 12px;
                right: 12px;
                bottom: 12px;
                max-width: 640px;
                margin: 0 auto;
            "
        ></div>

        <main id="view"></main>

        <!--
            AGPL 第 13 条要求：用户通过网络使用本程序时，必须能拿到它的源代码。
            这个链接就是在履行那一条。改仓库地址或改名时记得同步这里 ——
            链接失效等于没履行，而「忘了放链接」属于许可违规，不是疏忽。
        -->
        <footer class="footer">
            <a
                href="https://github.com/hashiqi12138/reader-cloudflare"
                target="_blank"
                rel="noreferrer"
            >
                源代码
            </a>
            <span>· 许可 AGPL-3.0-or-later</span>
        </footer>

        <script type="module" src="/app.js"></script>
    </body>
</html>
