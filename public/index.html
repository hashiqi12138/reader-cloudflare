<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="amber">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <meta name="description" content="兼容 Legado 书源规则的聚合阅读器" />
        <title>书源阅读器</title>
        <!--
            装到桌面（PWA）：`manifest.json` 给名字/图标/独立窗口，`sw.js` 给离线外壳。
            `theme-color` 与应用图标取同一个琥珀色（`--accent`，见 style.css）。
            iOS 不认 manifest 里的图标，所以要单独给一张 `apple-touch-icon`；
            `apple-mobile-web-app-*` 那几个 meta 是给老 iOS 的（新版本认 display: standalone）。
        -->
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#b4712a" />
        <link rel="icon" href="/icon-192.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="书源阅读器" />
        <link rel="stylesheet" href="/style.css" />
        <!--
            刻意不做「先渲染骨架再水合」那一套：这是个单页小应用，
            首屏多等几十毫秒换来说到底更简单的代码，划算。
        -->
    </head>
    <body data-reader="0">
        <header class="topbar">
            <a class="brand" href="#/home">
                <span class="brand-mark">书</span>
                <span class="brand-text">书源阅读器</span>
            </a>
            <nav id="nav" class="nav"></nav>
            <div class="topbar-right">
                <span id="account"></span>
            </div>
        </header>

        <main id="view"></main>

        <!-- 手机上用底部导航：顶栏那几个文字标签在窄屏里会挤成一排 -->
        <nav id="bottom-nav" class="bottom-nav"></nav>

        <div id="toast" hidden></div>

        <!--
            AGPL 第 13 条要求：用户通过网络使用本程序时，必须能拿到它的源代码。
            这个链接就是在履行那一条。改仓库地址或改名时记得同步这里 ——
            链接失效等于没履行，而「忘了放链接」属于许可违规，不是疏忽。
        -->
        <footer class="footer">
            <a
                id="source-link"
                href="https://github.com/hashiqi12138/reader-cloudflare"
                target="_blank"
                rel="noreferrer"
            >
                源代码
            </a>
            <span class="dot">·</span>
            <span>AGPL-3.0-or-later</span>
            <span class="dot">·</span>
            <!--
                版本号由 app.js 填（`/api/version`），点开是「关于」（版本 + 更新记录）。
                这里只放一个字占位：脚本或接口挂了的时候，页脚不该出现一个空白按钮。
            -->
            <button id="version" class="link" type="button" title="版本与更新记录">关于</button>
        </footer>

        <script type="module" src="/app.js"></script>
    </body>
</html>
