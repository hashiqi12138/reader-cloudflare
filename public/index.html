<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="amber">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <meta name="description" content="兼容 Legado 书源规则的聚合阅读器" />
        <title>书源阅读器</title>
        <link rel="stylesheet" href="/style.css" />
        <!--
            刻意不做「先渲染骨架再水合」那一套：这是个单页小应用，
            首屏多等几十毫秒换来说到底更简单的代码，划算。
        -->
    </head>
    <body data-reader="0">
        <header class="topbar">
            <a class="brand" href="#/home">
                <span class="brand-mark">书</span>
                <span class="brand-text">书源阅读器</span>
            </a>
            <nav id="nav" class="nav"></nav>
            <div class="topbar-right">
                <span id="account"></span>
            </div>
        </header>

        <main id="view"></main>

        <!-- 手机上用底部导航：顶栏那几个文字标签在窄屏里会挤成一排 -->
        <nav id="bottom-nav" class="bottom-nav"></nav>

        <div id="toast" hidden></div>

        <!--
            AGPL 第 13 条要求：用户通过网络使用本程序时，必须能拿到它的源代码。
            这个链接就是在履行那一条。改仓库地址或改名时记得同步这里 ——
            链接失效等于没履行，而「忘了放链接」属于许可违规，不是疏忽。
        -->
        <footer class="footer">
            <a
                id="source-link"
                href="https://github.com/hashiqi12138/reader-cloudflare"
                target="_blank"
                rel="noreferrer"
            >
                源代码
            </a>
            <span class="dot">·</span>
            <span>AGPL-3.0-or-later</span>
        </footer>

        <script type="module" src="/app.js"></script>
    </body>
</html>
